---
- name: Bootstrap OSNOVA IT main server
  hosts: main
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check target OS family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "This bootstrap is written for Ubuntu/Debian hosts only."

    - name: Check admin user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ server_admin_user }}"

    - name: Check SSH authorized_keys before key-only hardening
      ansible.builtin.stat:
        path: "/home/{{ server_admin_user }}/.ssh/authorized_keys"
      register: admin_authorized_keys

    - name: Decide whether SSH hardening can be applied safely
      ansible.builtin.set_fact:
        effective_ssh_hardening_enabled: "{{ ssh_hardening_enabled and admin_authorized_keys.stat.exists and (admin_authorized_keys.stat.size | int > 0) }}"

    - name: Report skipped SSH hardening when no admin key is installed
      ansible.builtin.debug:
        msg: "SSH hardening is skipped because /home/{{ server_admin_user }}/.ssh/authorized_keys is missing or empty. Bootstrap will continue without disabling password login."
      when:
        - ssh_hardening_enabled
        - not effective_ssh_hardening_enabled

    - name: Stop if storage UUIDs are not configured
      ansible.builtin.assert:
        that:
          - not storage_mounts_enabled or ufiles_uuid != "SET_UFILES_UUID"
          - not storage_mounts_enabled or x_files_uuid != "SET_X_FILES_UUID"
          - not storage_mounts_enabled or mega_files_uuid != "SET_MEGA_FILES_UUID"
        fail_msg: "Set ufiles_uuid, x_files_uuid, and mega_files_uuid in group_vars/all.yml before mounting disks."

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: not ansible_check_mode

    - name: Restart xrdp
      ansible.builtin.service:
        name: xrdp
        state: restarted
      when: not ansible_check_mode

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
      when: not ansible_check_mode

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: not ansible_check_mode

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    - name: Ensure storage group exists
      ansible.builtin.group:
        name: "{{ storage_group }}"
        gid: "{{ storage_group_gid }}"
        state: present

    - name: Add admin user to operational groups
      ansible.builtin.user:
        name: "{{ server_admin_user }}"
        groups:
          - docker
          - "{{ storage_group }}"
        append: true
      when: not ansible_check_mode

    - name: Install Codex CLI globally with npm
      ansible.builtin.shell: |
        set -euo pipefail
        if ! npm list -g @openai/codex >/dev/null 2>&1; then
          npm install -g @openai/codex
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: not ansible_check_mode

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Verify Docker Compose plugin
      ansible.builtin.command: docker compose version
      changed_when: false
      when: not ansible_check_mode

    - name: Configure SSH hardening
      ansible.builtin.template:
        src: sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-osnova-hardening.conf
        owner: root
        group: root
        mode: "0644"
      when: effective_ssh_hardening_enabled
      notify: Reload ssh

    - name: Validate SSH configuration before reload
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when:
        - effective_ssh_hardening_enabled
        - not ansible_check_mode

    - name: Configure UFW default incoming policy
      ansible.builtin.command: ufw default deny incoming
      changed_when: false
      when: firewall_enabled

    - name: Configure UFW default outgoing policy
      ansible.builtin.command: ufw default allow outgoing
      changed_when: false
      when: firewall_enabled

    - name: Allow explicit public TCP ports
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      changed_when: false
      loop: "{{ public_tcp_ports }}"
      when: firewall_enabled

    - name: Allow RDP only from trusted sources
      ansible.builtin.command: "ufw allow from {{ item }} to any port 3389 proto tcp"
      changed_when: false
      loop: "{{ trusted_rdp_sources }}"
      when:
        - firewall_enabled
        - rdp_enabled

    - name: Enable UFW
      ansible.builtin.command: ufw --force enable
      changed_when: false
      when: firewall_enabled

    - name: Check storage mountpoints before directory management
      ansible.builtin.command: "mountpoint -q {{ item }}"
      register: pre_mountpoint_checks
      failed_when: false
      changed_when: false
      check_mode: false
      loop:
        - "{{ ufiles_mount }}"
        - "{{ x_files_mount }}"
        - "{{ mega_files_mount }}"
      when: storage_mounts_enabled

    - name: Ensure storage parent directory exists
      ansible.builtin.file:
        path: /srv/storage
        state: directory
        owner: "{{ server_admin_user }}"
        group: "{{ storage_group }}"
        mode: "0750"
      when: storage_mounts_enabled

    - name: Create unmounted storage mountpoints
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        owner: "{{ server_admin_user }}"
        group: "{{ storage_group }}"
        mode: "0750"
      loop: "{{ pre_mountpoint_checks.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - storage_mounts_enabled
        - item.rc != 0

    - name: Persist ufiles mount in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^UUID={{ ufiles_uuid | regex_escape() }}\s+'
        line: "UUID={{ ufiles_uuid }} {{ ufiles_mount }} {{ ufiles_fstype }} {{ ufiles_mount_options }} 0 2"
        backup: true
      when: storage_mounts_enabled

    - name: Persist x-files mount in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^UUID={{ x_files_uuid | regex_escape() }}\s+'
        line: "UUID={{ x_files_uuid }} {{ x_files_mount | replace(' ', '\\040') }} {{ storage_ntfs_fstype }} {{ storage_ntfs_mount_options }} 0 0"
        backup: true
      when: storage_mounts_enabled

    - name: Persist mega-files mount in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^UUID={{ mega_files_uuid | regex_escape() }}\s+'
        line: "UUID={{ mega_files_uuid }} {{ mega_files_mount | replace(' ', '\\040') }} {{ storage_ntfs_fstype }} {{ storage_ntfs_mount_options }} 0 0"
        backup: true
      when: storage_mounts_enabled

    - name: Check storage mountpoint status
      ansible.builtin.command: "mountpoint -q {{ item }}"
      register: mountpoint_checks
      failed_when: false
      changed_when: false
      check_mode: false
      loop:
        - "{{ ufiles_mount }}"
        - "{{ x_files_mount }}"
        - "{{ mega_files_mount }}"
      when: storage_mounts_enabled

    - name: Check x-files source mount options
      ansible.builtin.command: "findmnt -rn -S UUID={{ x_files_uuid }} -o OPTIONS -n"
      register: x_files_existing_mount_options
      failed_when: false
      changed_when: false
      check_mode: false
      when: storage_mounts_enabled

    - name: Check mega-files source mount options
      ansible.builtin.command: "findmnt -rn -S UUID={{ mega_files_uuid }} -o OPTIONS -n"
      register: mega_files_existing_mount_options
      failed_when: false
      changed_when: false
      check_mode: false
      when: storage_mounts_enabled

    - name: Refuse read-only x-files source mount
      ansible.builtin.assert:
        that:
          - x_files_existing_mount_options.rc != 0 or 'ro' not in x_files_existing_mount_options.stdout.split(',')
        fail_msg: >-
          x-files UUID {{ x_files_uuid }} is mounted read-only.
          Repair or remount the filesystem rw before rerunning bootstrap.
          Options: {{ x_files_existing_mount_options.stdout | default('unmounted') }}
      when: storage_mounts_enabled

    - name: Refuse read-only mega-files source mount
      ansible.builtin.assert:
        that:
          - mega_files_existing_mount_options.rc != 0 or 'ro' not in mega_files_existing_mount_options.stdout.split(',')
        fail_msg: >-
          mega-files UUID {{ mega_files_uuid }} is mounted read-only.
          Repair or remount the filesystem rw before rerunning bootstrap.
          Options: {{ mega_files_existing_mount_options.stdout | default('unmounted') }}
      when: storage_mounts_enabled

    - name: Check x-files existing source mount
      ansible.builtin.command: "findmnt -rn -S UUID={{ x_files_uuid }} -o TARGET"
      register: x_files_existing_mount
      failed_when: false
      changed_when: false
      check_mode: false
      when: storage_mounts_enabled

    - name: Check mega-files existing source mount
      ansible.builtin.command: "findmnt -rn -S UUID={{ mega_files_uuid }} -o TARGET"
      register: mega_files_existing_mount
      failed_when: false
      changed_when: false
      check_mode: false
      when: storage_mounts_enabled

    - name: Mount ufiles filesystem
      ansible.builtin.command: "mount {{ ufiles_mount }}"
      when:
        - storage_mounts_enabled
        - mountpoint_checks.results[0].rc != 0
        - not ansible_check_mode

    - name: Mount x-files filesystem
      ansible.builtin.command: "mount {{ x_files_mount }}"
      when:
        - storage_mounts_enabled
        - mountpoint_checks.results[1].rc != 0
        - x_files_existing_mount.rc != 0
        - not ansible_check_mode

    - name: Bind already mounted x-files to storage mountpoint
      ansible.builtin.command: "mount --bind {{ x_files_existing_mount.stdout_lines[0] }} {{ x_files_mount }}"
      when:
        - storage_mounts_enabled
        - mountpoint_checks.results[1].rc != 0
        - x_files_existing_mount.rc == 0
        - x_files_existing_mount.stdout_lines | length > 0
        - x_files_existing_mount.stdout_lines[0] != x_files_mount
        - not ansible_check_mode

    - name: Mount mega-files filesystem
      ansible.builtin.command: "mount {{ mega_files_mount }}"
      when:
        - storage_mounts_enabled
        - mountpoint_checks.results[2].rc != 0
        - mega_files_existing_mount.rc != 0
        - not ansible_check_mode

    - name: Bind already mounted mega-files to storage mountpoint
      ansible.builtin.command: "mount --bind {{ mega_files_existing_mount.stdout_lines[0] }} {{ mega_files_mount }}"
      when:
        - storage_mounts_enabled
        - mountpoint_checks.results[2].rc != 0
        - mega_files_existing_mount.rc == 0
        - mega_files_existing_mount.stdout_lines | length > 0
        - mega_files_existing_mount.stdout_lines[0] != mega_files_mount
        - not ansible_check_mode

    - name: Check storage mount target options
      ansible.builtin.command: "findmnt -rn -T {{ item }} -o OPTIONS -n"
      register: storage_target_options
      failed_when: false
      changed_when: false
      check_mode: false
      loop:
        - "{{ ufiles_mount }}"
        - "{{ x_files_mount }}"
        - "{{ mega_files_mount }}"
      when: storage_mounts_enabled

    - name: Refuse read-only storage mount targets
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - "'rw' in item.stdout.split(',')"
          - "'ro' not in item.stdout.split(',')"
        fail_msg: >-
          Storage target {{ item.item }} is not writable or not mounted.
          Mount options: {{ item.stdout | default('unmounted') }}
      loop: "{{ storage_target_options.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: storage_mounts_enabled

    - name: Check godny_soft mount target options
      ansible.builtin.command: "findmnt -rn -T {{ godny_soft_mount }} -o OPTIONS -n"
      register: godny_soft_mount_options
      failed_when: false
      changed_when: false
      check_mode: false
      when: nextcloud_enabled

    - name: Refuse read-only godny_soft mount target
      ansible.builtin.assert:
        that:
          - godny_soft_mount_options.rc == 0
          - "'rw' in godny_soft_mount_options.stdout.split(',')"
          - "'ro' not in godny_soft_mount_options.stdout.split(',')"
        fail_msg: >-
          godny_soft mount {{ godny_soft_mount }} is not writable or not mounted.
          Mount options: {{ godny_soft_mount_options.stdout | default('unmounted') }}.
          Repair the mount before exposing it as writable Nextcloud external storage.
      when: nextcloud_enabled

    - name: Create Nextcloud directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ nextcloud_root }}", owner: root, group: root, mode: "0750" }
        - { path: "{{ nextcloud_data_dir }}", owner: "33", group: "33", mode: "0770" }
      when: nextcloud_enabled

    - name: Deploy Nextcloud compose file
      ansible.builtin.template:
        src: nextcloud-compose.yml.j2
        dest: "{{ nextcloud_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0640"
      when: nextcloud_enabled

    - name: Check existing Nextcloud environment
      ansible.builtin.stat:
        path: "{{ nextcloud_root }}/nextcloud.env"
      register: nextcloud_env_file
      when: nextcloud_enabled

    - name: Generate Nextcloud admin password
      ansible.builtin.command: openssl rand -base64 36
      register: generated_nextcloud_admin_password
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - nextcloud_enabled
        - not nextcloud_env_file.stat.exists
        - nextcloud_admin_password == "CHANGE_ME"

    - name: Generate Nextcloud database password
      ansible.builtin.command: openssl rand -base64 36
      register: generated_nextcloud_db_password
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - nextcloud_enabled
        - not nextcloud_env_file.stat.exists
        - nextcloud_db_password == "CHANGE_ME"

    - name: Generate Nextcloud database root password
      ansible.builtin.command: openssl rand -base64 36
      register: generated_nextcloud_db_root_password
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - nextcloud_enabled
        - not nextcloud_env_file.stat.exists
        - nextcloud_db_root_password == "CHANGE_ME"

    - name: Deploy Nextcloud environment
      ansible.builtin.copy:
        dest: "{{ nextcloud_root }}/nextcloud.env"
        owner: root
        group: root
        mode: "0600"
        force: false
        content: |
          MYSQL_DATABASE=nextcloud
          MYSQL_USER=nextcloud
          MYSQL_PASSWORD={{ nextcloud_db_password if nextcloud_db_password != "CHANGE_ME" else generated_nextcloud_db_password.stdout }}
          MYSQL_ROOT_PASSWORD={{ nextcloud_db_root_password if nextcloud_db_root_password != "CHANGE_ME" else generated_nextcloud_db_root_password.stdout }}
          MYSQL_HOST=db
          NEXTCLOUD_ADMIN_USER={{ nextcloud_admin_user }}
          NEXTCLOUD_ADMIN_PASSWORD={{ nextcloud_admin_password if nextcloud_admin_password != "CHANGE_ME" else generated_nextcloud_admin_password.stdout }}
          NEXTCLOUD_TRUSTED_DOMAINS={{ nextcloud_trusted_domains | join(' ') }}
          REDIS_HOST=redis
      no_log: true
      when:
        - nextcloud_enabled
        - not nextcloud_env_file.stat.exists

    - name: Start Nextcloud stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ nextcloud_root }}"
      register: nextcloud_compose_up
      changed_when: "'Started' in nextcloud_compose_up.stdout or 'Created' in nextcloud_compose_up.stdout or 'Recreated' in nextcloud_compose_up.stdout"
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Wait for Nextcloud occ
      ansible.builtin.command: docker compose exec -T -u www-data app php occ status
      args:
        chdir: "{{ nextcloud_root }}"
      register: nextcloud_occ_status
      retries: 30
      delay: 10
      until: nextcloud_occ_status.rc == 0
      changed_when: false
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Verify Nextcloud container can write external storage paths
      ansible.builtin.command: >-
        docker compose exec -T -u www-data app sh -lc
        'test -d {{ item.container_path }} && tmp="{{ item.container_path }}/.ansible-write-test-$$" && touch "$tmp" && rm -f "$tmp"'
      args:
        chdir: "{{ nextcloud_root }}"
      changed_when: false
      loop: "{{ nextcloud_external_storages }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Enable Nextcloud external storage app
      ansible.builtin.command: docker compose exec -T -u www-data app php occ app:enable files_external
      args:
        chdir: "{{ nextcloud_root }}"
      register: nextcloud_external_app
      changed_when: "'enabled' in nextcloud_external_app.stdout"
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Read Nextcloud external storage mounts
      ansible.builtin.command: docker compose exec -T -u www-data app php occ files_external:list
      args:
        chdir: "{{ nextcloud_root }}"
      register: nextcloud_external_mounts
      changed_when: false
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Add Nextcloud external storage mounts
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - -u
          - www-data
          - app
          - php
          - occ
          - files_external:create
          - "{{ item.name }}"
          - local
          - null::null
          - -c
          - "datadir={{ item.container_path }}"
      args:
        chdir: "{{ nextcloud_root }}"
      loop: "{{ nextcloud_external_storages }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - nextcloud_enabled
        - not ansible_check_mode
        - item.name not in nextcloud_external_mounts.stdout

    - name: Read Nextcloud external storage mounts after changes
      ansible.builtin.command: docker compose exec -T -u www-data app php occ files_external:list
      args:
        chdir: "{{ nextcloud_root }}"
      register: nextcloud_external_mounts_after
      changed_when: false
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Verify Nextcloud external storage mounts are configured
      ansible.builtin.assert:
        that:
          - "'/' ~ item.name in nextcloud_external_mounts_after.stdout"
        fail_msg: >-
          Nextcloud external storage mounts were not configured.
          Current mounts: {{ nextcloud_external_mounts_after.stdout | default('unavailable') }}
      loop: "{{ nextcloud_external_storages }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - nextcloud_enabled
        - not ansible_check_mode

    - name: Scan Nextcloud external storage file cache
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - -u
          - www-data
          - app
          - php
          - occ
          - files:scan
          - "--path=/{{ nextcloud_admin_user }}/files/{{ item }}"
      args:
        chdir: "{{ nextcloud_root }}"
      loop: "{{ nextcloud_external_storages | map(attribute='name') | list }}"
      changed_when: false
      when:
        - nextcloud_enabled
        - nextcloud_external_storage_scan_enabled
        - not ansible_check_mode

    - name: Configure XRDP
      ansible.builtin.template:
        src: xrdp.ini.j2
        dest: /etc/xrdp/xrdp.ini
        owner: root
        group: root
        mode: "0644"
      when: rdp_enabled
      notify: Restart xrdp

    - name: Enable XRDP
      ansible.builtin.service:
        name: xrdp
        enabled: true
        state: started
      when:
        - rdp_enabled
        - not ansible_check_mode

    - name: Configure fail2ban XRDP jail
      ansible.builtin.template:
        src: fail2ban-xrdp.local.j2
        dest: /etc/fail2ban/jail.d/xrdp.local
        owner: root
        group: root
        mode: "0644"
      when: rdp_enabled
      notify: Restart fail2ban

    - name: Harden discovered env and key file permissions
      ansible.builtin.find:
        paths: "{{ project_roots }}"
        patterns:
          - ".env"
          - "*.key"
          - "id_ed25519"
          - "id_rsa"
        recurse: true
        file_type: file
      register: secret_files

    - name: Set secret files to 0600
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0600"
      loop: "{{ secret_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Deploy backup script
      ansible.builtin.template:
        src: osnova-backup.sh.j2
        dest: "{{ backup_script_path }}"
        owner: root
        group: root
        mode: "0750"
      when: backup_enabled

    - name: Deploy backup systemd service
      ansible.builtin.template:
        src: osnova-backup.service.j2
        dest: /etc/systemd/system/osnova-backup.service
        owner: root
        group: root
        mode: "0644"
      when: backup_enabled
      notify: Reload systemd

    - name: Deploy backup systemd timer
      ansible.builtin.template:
        src: osnova-backup.timer.j2
        dest: /etc/systemd/system/osnova-backup.timer
        owner: root
        group: root
        mode: "0644"
      when: backup_enabled
      notify: Reload systemd

    - name: Enable backup timer
      ansible.builtin.systemd:
        name: osnova-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        - backup_enabled
        - not ansible_check_mode
