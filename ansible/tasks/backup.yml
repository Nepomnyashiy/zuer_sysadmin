---
- name: Validate backup activation gate
  ansible.builtin.assert:
    that:
      - not backup_timer_enabled or backup_recovery_key_confirmed
    fail_msg: >-
      Set backup_recovery_key_confirmed=true only after the Restic password
      has been stored outside ZUER and a manual restore drill has passed.
  when: backup_enabled

- name: Create backup configuration and state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ backup_environment_path | dirname }}"
      mode: "0700"
    - path: "{{ backup_repository | dirname }}"
      mode: "0700"
    - path: "{{ backup_staging_root }}"
      mode: "0700"
    - path: "{{ backup_state_dir }}"
      mode: "0700"
    - path: "{{ backup_cache_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"
  when: backup_enabled

- name: Check Restic password file
  ansible.builtin.stat:
    path: "{{ backup_password_path }}"
  register: backup_password_file
  when: backup_enabled

- name: Generate host-local Restic password
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    openssl rand -base64 48 > {{ backup_password_path | quote }}
  args:
    executable: /bin/bash
    creates: "{{ backup_password_path }}"
  no_log: true
  when:
    - backup_enabled
    - not ansible_check_mode
    - not backup_password_file.stat.exists

- name: Enforce Restic password permissions
  ansible.builtin.file:
    path: "{{ backup_password_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - backup_enabled
    - not ansible_check_mode or backup_password_file.stat.exists

- name: Deploy Restic environment
  ansible.builtin.template:
    src: osnova-restic.env.j2
    dest: "{{ backup_environment_path }}"
    owner: root
    group: root
    mode: "0600"
  when: backup_enabled

- name: Deploy backup orchestration scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - src: osnova-backup.sh.j2
      dest: "{{ backup_script_path }}"
    - src: osnova-backupctl.sh.j2
      dest: "{{ backup_ctl_path }}"
  loop_control:
    label: "{{ item.dest }}"
  when: backup_enabled

- name: Deploy backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - osnova-backup.service
    - osnova-backup.timer
    - osnova-backup-maintenance@.service
    - osnova-backup-prune.timer
    - osnova-backup-check.timer
    - osnova-backup-check-data.timer
  when: backup_enabled
  notify: Reload systemd

- name: Configure backup timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ backup_timer_enabled | bool }}"
    state: "{{ 'started' if backup_timer_enabled else 'stopped' }}"
    daemon_reload: true
  loop:
    - osnova-backup.timer
    - osnova-backup-prune.timer
    - osnova-backup-check.timer
    - osnova-backup-check-data.timer
  when:
    - backup_enabled
    - not ansible_check_mode
