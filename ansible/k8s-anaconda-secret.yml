---
- name: Deliver the allowlisted Anaconda Kubernetes Secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - group_vars/vault.yml

  vars:
    anaconda_secret_apply: false
    anaconda_secret_namespace: anaconda
    anaconda_secret_name: anaconda-secret
    anaconda_secret_allowlist:
      - POSTGRES_PASSWORD
      - TELEGRAM_BOT_TOKEN
      - EMAIL_IMAP_USER
      - EMAIL_IMAP_PASSWORD
    anaconda_secret_values:
      POSTGRES_PASSWORD: "{{ vault_anaconda.postgres_password }}"
      TELEGRAM_BOT_TOKEN: "{{ vault_anaconda.telegram_bot_token }}"
      EMAIL_IMAP_USER: "{{ vault_anaconda.email_imap_user }}"
      EMAIL_IMAP_PASSWORD: "{{ vault_anaconda.email_imap_password }}"
    anaconda_secret_manifest:
      apiVersion: v1
      kind: List
      items:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ anaconda_secret_namespace }}"
        - apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ anaconda_secret_name }}"
            namespace: "{{ anaconda_secret_namespace }}"
          type: Opaque
          stringData: "{{ anaconda_secret_values }}"

  tasks:
    - name: Validate the exact allowlist and non-empty Vault values
      ansible.builtin.assert:
        that:
          - anaconda_secret_values.keys() | list | sort == anaconda_secret_allowlist | sort
          - anaconda_secret_values.values() | select('equalto', '') | list | length == 0
        quiet: true
      no_log: true

    - name: Validate Namespace and Secret locally without changing Kubernetes
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --dry-run=client
          - --validate=false
          - -f
          - "-"
        stdin: "{{ anaconda_secret_manifest | to_json }}"
      changed_when: false
      no_log: true
      when: not (anaconda_secret_apply | bool)

    - name: Create or update Namespace and Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "-"
        stdin: "{{ anaconda_secret_manifest | to_json }}"
      changed_when: true
      no_log: true
      when: anaconda_secret_apply | bool

    - name: Report metadata-only result
      ansible.builtin.debug:
        msg:
          - "mode: {{ 'apply' if (anaconda_secret_apply | bool) else 'client-dry-run' }}"
          - "namespace: {{ anaconda_secret_namespace }}"
          - "secret: {{ anaconda_secret_name }}"
          - "POSTGRES_PASSWORD: present"
          - "TELEGRAM_BOT_TOKEN: present"
          - "EMAIL_IMAP_USER: present"
          - "EMAIL_IMAP_PASSWORD: present"
