apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-registry
  namespace: ingress
  labels:
    app.kubernetes.io/name: local-registry
    app.kubernetes.io/part-of: osnova-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: local-registry-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-registry-data
  namespace: ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: local-registry
  namespace: ingress
  labels:
    app.kubernetes.io/name: local-registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: local-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500

