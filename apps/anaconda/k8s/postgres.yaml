apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: anaconda-postgres
  labels:
    app.kubernetes.io/name: anaconda-postgres
spec:
  serviceName: anaconda-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anaconda-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anaconda-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: anaconda_db
            - name: POSTGRES_USER
              value: anaconda_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anaconda-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: osnova-local-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anaconda-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anaconda-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
