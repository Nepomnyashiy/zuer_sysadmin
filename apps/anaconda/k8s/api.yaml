apiVersion: apps/v1
kind: Deployment
metadata:
  name: anaconda-api
  labels:
    app.kubernetes.io/name: anaconda-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anaconda-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anaconda-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 127.0.0.1:30500/anaconda/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: anaconda-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anaconda-secret
                  key: POSTGRES_PASSWORD
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anaconda-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: EMAIL_IMAP_USER
              valueFrom:
                secretKeyRef:
                  name: anaconda-secret
                  key: EMAIL_IMAP_USER
            - name: EMAIL_IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anaconda-secret
                  key: EMAIL_IMAP_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anaconda-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anaconda-api
  ports:
    - name: http
      port: 8000
      targetPort: http
