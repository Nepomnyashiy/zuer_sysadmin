apiVersion: apps/v1
kind: Deployment
metadata:
  name: anaconda-api
  labels:
    app.kubernetes.io/name: anaconda-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anaconda-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anaconda-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 127.0.0.1:30500/anaconda/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: anaconda-config
            - secretRef:
                name: anaconda-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anaconda-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://anaconda_user:$(POSTGRES_PASSWORD)@anaconda-postgres:5432/anaconda_db
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anaconda-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anaconda-api
  ports:
    - name: http
      port: 8000
      targetPort: http
