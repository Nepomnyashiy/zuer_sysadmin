apiVersion: apps/v1
kind: Deployment
metadata:
  name: anaconda-web
  labels:
    app.kubernetes.io/name: anaconda-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anaconda-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anaconda-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: 127.0.0.1:30500/anaconda/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: anaconda-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anaconda-web
  ports:
    - name: http
      port: 8080
      targetPort: http
