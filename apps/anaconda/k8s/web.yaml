apiVersion: apps/v1
kind: Deployment
metadata:
  name: anaconda-web
  labels:
    app.kubernetes.io/name: anaconda-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anaconda-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anaconda-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: 127.0.0.1:30500/anaconda/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: VITE_API_URL
              value: https://api.anaconda.godny.tech
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: anaconda-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anaconda-web
  ports:
    - name: http
      port: 5173
      targetPort: http

