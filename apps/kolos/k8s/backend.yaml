apiVersion: apps/v1
kind: Deployment
metadata:
  name: kolos-backend
  labels:
    app.kubernetes.io/name: kolos-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kolos-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kolos-backend
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: 127.0.0.1:30500/kolos/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1337
          envFrom:
            - configMapRef:
                name: kolos-config
            - secretRef:
                name: kolos-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/public/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: kolos-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: kolos-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kolos-backend
  ports:
    - name: http
      port: 1337
      targetPort: http

