apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kolos-postgres
  labels:
    app.kubernetes.io/name: kolos-postgres
spec:
  serviceName: kolos-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kolos-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kolos-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: kolos-secret
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kolos-secret
                  key: DATABASE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kolos-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: osnova-local-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kolos-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kolos-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
