apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
spec:
  storageClassName: osnova-local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-ai-data
spec:
  storageClassName: osnova-local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: black-mamba-config
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-ai
  labels:
    app.kubernetes.io/name: open-webui-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui-ai
    spec:
      containers:
        - name: webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: black-mamba-config
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-ai-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui-ai
  ports:
    - name: http
      port: 8080
      targetPort: http
