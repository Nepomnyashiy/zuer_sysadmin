apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: gemma4:e4b
        litellm_params:
          model: ollama/gemma4:e4b
          api_base: http://ollama:11434
      - model_name: qwen2.5-coder:7b
        litellm_params:
          model: ollama/qwen2.5-coder:7b
          api_base: http://ollama:11434
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

