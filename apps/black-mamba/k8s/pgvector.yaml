apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: black-mamba-pgvector
  labels:
    app.kubernetes.io/name: black-mamba-pgvector
spec:
  serviceName: black-mamba-pgvector
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: black-mamba-pgvector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: black-mamba-pgvector
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: black-mamba-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: black-mamba-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: black-mamba-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: black-mamba-pgvector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: black-mamba-pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

