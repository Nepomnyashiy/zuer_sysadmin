apiVersion: apps/v1
kind: Deployment
metadata:
  name: barber-backend
  labels:
    app.kubernetes.io/name: barber-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: barber-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: barber-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: 127.0.0.1:30500/barber/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: barber-config
            - secretRef:
                name: barber-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: barber-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: barber-backend
  ports:
    - name: http
      port: 8000
      targetPort: http

